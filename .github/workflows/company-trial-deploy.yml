name: Deploy to Company Trial DB

on:
  push:
    branches: [qa,main]
    paths:
      - 'sql/**.sql'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSH key to file
        shell: powershell
        run: |
          $key = "${{ secrets.BASTION_SSH_KEY }}"
          Set-Content -Path "$env:RUNNER_TEMP\bastion_key.pem" -Value $key
          icacls "$env:RUNNER_TEMP\bastion_key.pem" /inheritance:r
          icacls "$env:RUNNER_TEMP\bastion_key.pem" /grant:r "SYSTEM:(R)"
          icacls "$env:RUNNER_TEMP\bastion_key.pem" /grant:r "Administrators:(R)"
          icacls "$env:RUNNER_TEMP\bastion_key.pem" /grant:r "*S-1-5-20:(R)"
          icacls "$env:RUNNER_TEMP\bastion_key.pem"

      - name: Open tunnel and run SQL file (combined, same step)
        shell: powershell
        env:
          PGPASSWORD: ${{ secrets.TRIAL_DB_PASSWORD }}
        run: |
          $key = "$env:RUNNER_TEMP\bastion_key.pem"
          icacls $key /inheritance:r
          icacls $key /grant:r "SYSTEM:(R)"
          icacls $key /grant:r "Administrators:(R)"
          icacls $key /grant:r "*S-1-5-20:(R)"
          icacls $key

          $sshProc = Start-Process ssh -ArgumentList "-i", $key, "-o", "StrictHostKeyChecking=no", "-L", "5433:${{ secrets.TRIAL_DB_HOST }}:5432", "ec2-user@${{ secrets.BASTION_IP }}", "-N", "-v" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\ssh_out.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\ssh_err.log" `
            -WindowStyle Hidden -PassThru

          Start-Sleep -Seconds 10

          Write-Host "----- Checking if port 5433 is listening -----"
          Test-NetConnection -ComputerName localhost -Port 5433

          Write-Host "----- Running SQL file -----"
          & "C:\Program Files\PostgreSQL\18\bin\psql.exe" -h localhost -p 5433 -U ${{ secrets.TRIAL_DB_USER }} -d ${{ secrets.TRIAL_DB_NAME }} -f sql/changes.sql
          $psqlExitCode = $LASTEXITCODE

          Write-Host "----- Closing SSH tunnel -----"
          Stop-Process -Id $sshProc.Id -Force -ErrorAction SilentlyContinue

          if ($psqlExitCode -ne 0) {
            Write-Host "----- SSH stderr (for debugging) -----"
            Get-Content "$env:RUNNER_TEMP\ssh_err.log" -ErrorAction SilentlyContinue
            exit $psqlExitCode
          }